name: CI/CD Pipeline Build and Deploy

on:
  push:
    branches: [ "pratik" ] 
jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout project repository
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Backend Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./server/Dockerfile
        push: true
        tags: pratikkanadiya/acoustic-backend:latest,pratikkanadiya/acoustic-backend:v1

    - name: Build and Push Frontend Image
      uses: docker/build-push-action@v5
      with:
        context: ./acousticspace-dashboard
        file: ./acousticspace-dashboard/Dockerfile
        push: true
        tags: pratikkanadiya/acoustic-frontend:latest,pratikkanadiya/acoustic-frontend:v1
